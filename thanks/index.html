<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thank you</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #FAF9F5;
    --text: #1B1B2A;
    --muted: #55555F;
    --border: #EFE9DD;
    --paypal-bg: #F3F7FD;
    --paypal-border: #DDE6F4;
    --paypal-accent: #003086;
    --paypal-btn: #0070BA;
    --paypal-btn-hover: #005A94;
    --card-bg: #FFFFFF;
    --row-border: #EAF0FA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }
  body {
    font-family: "Outfit", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
  }
  a { color: var(--paypal-btn); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--paypal-btn); outline-offset: 2px; }

  @keyframes tj-rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    header { animation: none !important; }
    .cta { transition: none; }
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
  }

  .nav-gutter {
    padding: 0 28px;
  }
  nav {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 500;
  }
  nav a { color: var(--text); text-decoration: none; }
  nav a:hover { opacity: .7; }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
    padding: 76px 28px 52px;
    max-width: 740px;
    margin: 0 auto;
    animation: tj-rise 420ms cubic-bezier(.4,0,.2,1) both;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 15px 7px 12px;
    border-radius: 999px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(27,27,42,.05);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #4A4A57;
  }
  .badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: #22C55E;
    box-shadow: 0 0 0 4px rgba(34,197,94,.18);
  }

  h1 {
    margin: 0;
    font-size: 48px;
    line-height: 1.05;
    font-weight: 500;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }

  header p {
    margin: 0;
    font-size: 17px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 570px;
    text-wrap: pretty;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 52px 28px 76px;
    border-top: 1px solid var(--border);
    background: var(--paypal-bg);
  }

  .section-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #5A6478;
  }
  main h2 {
    margin: 0;
    font-size: 29px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--paypal-accent);
  }

  .ways-card {
    width: 100%;
    max-width: 560px;
    background: var(--card-bg);
    border: 1px solid var(--paypal-border);
    border-radius: 24px;
    box-shadow: 0 10px 28px rgba(0,48,135,.08);
    padding: 8px 28px;
  }
  .ways-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid var(--row-border);
  }
  .ways-row:last-child { border-bottom: none; }
  .ways-row .label {
    font-size: 15.5px;
    font-weight: 600;
  }
  .ways-row .value {
    font-size: 14px;
    color: #5A6478;
    text-align: right;
  }
  .ways-row a.value {
    color: var(--paypal-btn);
    font-weight: 600;
    text-decoration: none;
  }
  .ways-row a.value:hover { text-decoration: underline; }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 15.5px;
    font-weight: 600;
    text-decoration: none;
    background: var(--paypal-btn);
    color: #FFFFFF;
    box-shadow: 0 6px 18px rgba(0,112,186,.28);
    transition: transform 200ms cubic-bezier(.4,0,.2,1), filter 200ms cubic-bezier(.4,0,.2,1);
  }
  .cta:hover { filter: brightness(1.08); color: #FFFFFF; }
  .cta:active { transform: scale(0.97); }
  .cta .arrow { font-size: 17px; line-height: 1; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121218;
      --text: #F2F1EC;
      --muted: #B7B6C2;
      --border: #2A2A36;
      --paypal-bg: #16233B;
      --paypal-border: #24365A;
      --paypal-accent: #9FC1FF;
      --card-bg: #20202B;
      --row-border: #2A3A56;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121218;
    --text: #F2F1EC;
    --muted: #B7B6C2;
    --border: #2A2A36;
    --paypal-bg: #16233B;
    --paypal-border: #24365A;
    --paypal-accent: #9FC1FF;
    --card-bg: #20202B;
    --row-border: #2A3A56;
  }
</style>
</head>
<body>

<div class="page">
  <div class="nav-gutter">
    <nav>
      <a href="https://nhat.me">About me</a>
      <a href="https://go.nhat.io">Go registry</a>
      <a href="https://fonts.nhat.io">Ligaturized fonts</a>
    </nav>
  </div>

  <header>
    <div class="badge">
      <span class="dot"></span>
      <span>@nhatthm</span>
    </div>
    <h1 id="thank-you-title"></h1>
    <p id="thank-you-line"></p>
  </header>

  <main>
    <div class="section-label">
      <span class="eyebrow">If you want to do more</span>
      <h2>Free ways to help</h2>
    </div>

    <div class="ways-card">
      <div class="ways-row">
        <span class="label">Star a repo</span>
        <a class="value" href="https://github.com/nhatthm" target="_blank" rel="noopener noreferrer">github.com/nhatthm</a>
      </div>
      <div class="ways-row">
        <span class="label">File the bug you found</span>
        <span class="value">Reproductions welcome</span>
      </div>
      <div class="ways-row">
        <span class="label">Tell a colleague</span>
        <span class="value">It works better than ads</span>
      </div>
    </div>

    <a class="cta" href="/">
      <span>Back to the tip jar</span>
      <span class="arrow">&rarr;</span>
    </a>
  </main>
</div>

<script>
  const THANK_YOUS = [
    { title: "Thank you. The tip jar is heavier than it was a minute ago.", line: "Nothing else is needed from you. Go back to whatever you were building." },
    { title: "Received, and genuinely appreciated.", line: "That covers the next few late nights of maintenance. Back to work, both of us." },
    { title: "No strings attached.", line: "No account, no follow-up, no newsletter. Just a thank you and a green CI badge." },
    { title: "It landed. Truly.", line: "The receipt is in your inbox. The gratitude is on this page." },
    { title: "This actually helps. More than you'd think.", line: "It's a small thing that makes a real difference to whether this stays maintained." },
    { title: "Small amount, real difference.", line: "Every tip buys back an evening. This one is already spent on the issue queue." },
    { title: "But here we are.", line: "You didn't have to. That's rather the point of it." },
    { title: "Small karma, somewhere in CI.", line: "Somewhere a test suite just got a little more attention than it deserved." },
    { title: "That's really it.", line: "This is the part where I say thank you and you close the tab. Both are fine." },
    { title: "Rare, and noticed.", line: "Open source runs on people doing this. Not many do. You did." },
    { title: "Logged as a good sign.", line: "Filed under: reasons to keep answering issues at 1am." },
    { title: "The cost just moved, not appeared.", line: "The libraries were always going to be free. This makes them sustainable." },
    { title: "You're in the changelog now, quietly.", line: "Consider the next patch release partly your work." },
    { title: "Already earmarked, already useful.", line: "I'll spend it on coffee and then spend the coffee on your bug report." },
    { title: "Nothing to unlock, nothing to join.", line: "No tiers, no perks, no Discord. The changelog is the perk." },
    { title: "Optional, and chosen anyway.", line: "You just paid for something you already had. Thank you for that." },
    { title: "Quietly, this matters.", line: "The next person who runs `go get` will never know. I will." },
    { title: "The lights stay on a little longer.", line: "Support like this is why the README still says maintained." },
    { title: "A project just got a longer life.", line: "One fewer reason to archive a repo. Genuinely useful." },
    { title: "Simple as that.", line: "That's the whole transaction. Nothing to confirm, nothing to cancel." }
  ];
  const pick = THANK_YOUS[Math.floor(Math.random() * THANK_YOUS.length)];
  document.getElementById("thank-you-title").textContent = pick.title;
  document.getElementById("thank-you-line").textContent = pick.line;
</script>
</body>
</html>
